name: Governance and release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_governance.txt
      - name: Validate metadata and frozen research artifacts
        run: python -m scripts_ic.check_governance
